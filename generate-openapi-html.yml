name: openapi

services:
  intermediary:
    restart: no
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: dev
    healthcheck:
      test: pgrep -f "java -jar /sgr-intermediary.jar" || exit 1
      timeout: 10s
      interval: 10s
      retries: 3

  generator:
    restart: no
    image: openapitools/openapi-generator-cli:latest
    command: generate --skip-validate-spec -g html2 -i http://intermediary:8080/v3/api-docs -o /openapi
    volumes:
      - ./openapi:/openapi
    depends_on:
      intermediary:
        condition: service_healthy
